<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode Labeling</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #646d78; --line: #e2e5ea; --soft: #eef0f3;
  --accent: #2f6fde; --ok: #1f8a4c; --ok-bg: #e5f4ea; --bad: #c8372d; --bad-bg: #fbe9e7; --unc: #a66a00;
  --unc-bg: #fbf1dc; --mark: #7a4cd8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111417; --panel: #191d22; --ink: #e7eaee; --muted: #98a1ac; --line: #2a3038; --soft: #222830;
    --accent: #6b9cf0; --ok: #4cc27f; --ok-bg: #173022; --bad: #ef6a5f; --bad-bg: #3a1d1a; --unc: #e2a73a;
    --unc-bg: #362a12; --mark: #a98af0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
.stats { display: flex; gap: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
header label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
header input[type=text] { width: 120px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.layout { display: grid; grid-template-columns: 290px 1fr 340px; height: calc(100vh - 53px); }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.filters { display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.filters button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.list { overflow-y: auto; overflow-x: hidden; flex: 1; }
.item { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--soft); }
.item.sel { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .task { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .sub { display: flex; gap: 4px 6px; align-items: center; margin-top: 3px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.chip { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 18px; background: var(--soft); color: var(--muted); }
.chip.success { background: var(--ok-bg); color: var(--ok); }
.chip.failure { background: var(--bad-bg); color: var(--bad); }
.chip.uncertain { background: var(--unc-bg); color: var(--unc); }
main { overflow-y: auto; padding: 16px; min-width: 0; }
.title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.title h2 { margin: 0; font-size: 20px; }
.title .meta { color: var(--muted); font-size: 12px; }
.videos { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.videos .side { display: grid; gap: 8px; grid-template-rows: 1fr 1fr; }
video { width: 100%; display: block; background: #000; border-radius: 6px; aspect-ratio: 16 / 9; object-fit: contain; }
.cam { position: relative; }
video.pca { object-fit: fill; } /* the 224x224 map stretched back to the camera's 16:9: pixels line up with the camera */
.videos.both { grid-template-columns: repeat(3, 1fr); }
.pca-state { font-size: 12px; color: var(--muted); }
details.method { margin-top: 14px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
details.method summary { cursor: pointer; color: var(--ink); font-weight: 600; }
details.method ol { margin: 8px 0 4px 18px; padding: 0; } details.method li { margin: 4px 0; }
details.method .facts { margin-top: 6px; font-variant-numeric: tabular-nums; }
.cam span { position: absolute; left: 8px; top: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.45); padding: 1px 6px; border-radius: 4px; }
.controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.controls button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.controls .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 120px; }
.controls select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 6px; }
.timeline { position: relative; height: 44px; margin-top: 8px; cursor: pointer; user-select: none; }
.timeline .track { position: absolute; left: 0; right: 0; top: 14px; height: 6px; background: var(--soft); border-radius: 3px; }
.timeline .fill { position: absolute; left: 0; top: 14px; height: 6px; background: var(--accent); border-radius: 3px; }
.timeline .head { position: absolute; top: 9px; width: 2px; height: 16px; background: var(--ink); }
.timeline .pin { position: absolute; top: 0; transform: translateX(-50%); font-size: 10px; font-weight: 700; white-space: nowrap; }
.timeline .pin::after { content: ""; display: block; width: 2px; height: 22px; margin: 1px auto 0; background: currentColor; }
.pin.sim-fail { color: var(--bad); } .pin.sim-ok { color: var(--ok); }
.pin.disturb { color: var(--unc); }
.pin.human { color: var(--mark); top: 12px; }
.pin.human::after { display: none; }
.pin.human::before { content: ""; display: block; width: 2px; height: 12px; margin: 0 auto 1px; background: currentColor; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 16px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.right { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; }
.verdict { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin-top: 8px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; word-break: break-word; }
.warn { margin-top: 6px; font-size: 12px; color: var(--unc); }
.hidden-note { color: var(--muted); font-size: 12px; font-style: italic; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.choices button { padding: 10px 4px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 650; }
.choices button small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.choices button.success.on { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.choices button.failure.on { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choices button.uncertain.on { border-color: var(--unc); background: var(--unc-bg); color: var(--unc); }
.field { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field select, .field input, .field textarea { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.row { display: flex; gap: 6px; }
.row input { flex: 1; min-width: 0; }
.row button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.save { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 650; cursor: pointer; }
.save:disabled { opacity: .45; cursor: default; }
.status { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 18px; }
.keys { font-size: 11px; color: var(--muted); line-height: 1.7; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: 11px ui-monospace, monospace; background: var(--bg); }
.empty { color: var(--muted); padding: 40px; text-align: center; }
@media (max-width: 1100px) { .layout { grid-template-columns: 240px 1fr; } .right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } .layout { height: auto; } aside { max-height: 50vh; } }
@media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .videos { grid-template-columns: 1fr; } .videos .side { grid-template-rows: none; grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Episode Labeling</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <label><input type="checkbox" id="blind"> Blind mode</label>
  <label>Labeler <input type="text" id="labeler" placeholder="your name"></label>
</header>
<div class="layout">
  <aside>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"><div class="empty">Loading episodes…</div></main>
  <section class="right" id="right"></section>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const FILTERS = [["all", "All"], ["review", "Review queue"], ["unlabeled", "Unlabeled"], ["disagree", "Disagree"], ["sim_failure", "Sim: failure"], ["sim_success", "Sim: success"], ["recovery", "Recovery runs"], ["recovered", "Recovered"], ["dream", "Dream-1"], ["scripted", "Scripted"]];
let state = { episodes: [], reasons: [], filter: store.get("filter", "unlabeled"), sel: null, ep: null, draft: null };

function chip(label) { return label ? `<span class="chip ${esc(label)}">${esc(label)}</span>` : `<span class="chip">—</span>`; }
function pretty(r) { return r ? r.replaceAll("_", " ") : "—"; }
function blind() { return $("#blind").checked; }

function visible() {
  const f = state.filter;
  return state.episodes.filter(e =>
    f === "all" ? true :
    f === "unlabeled" ? !e.human_label :
    f === "review" ? e.auto_review && !e.human_label :
    f === "recovery" ? e.perturb_policy === "dream-1" :
    f === "recovered" ? e.recovered === true :
    f === "disagree" ? e.human_label && e.human_label !== "uncertain" && e.human_label !== e.sim_label :
    f === "sim_failure" ? e.sim_label === "failure" :
    f === "sim_success" ? e.sim_label === "success" :
    f === "dream" ? e.source === "dream-1" :
    f === "scripted" ? (e.source || "").startsWith("scripted") : true);
}

async function load(keepSel = true) {
  const r = await fetch("/api/episodes").then(r => r.json());
  state.episodes = r.episodes; state.reasons = r.reasons;
  if (!$("#labeler").value) $("#labeler").value = store.get("labeler", r.labeler === "anonymous" ? "" : r.labeler);
  renderStats(r.stats); renderFilters(); renderList();
  if (!keepSel || !state.sel) { const first = visible()[0] || state.episodes[0]; if (first) select(first.id); else $("#main").innerHTML = `<div class="empty">No episodes yet. Run run_episode.py or batch.py.</div>`; }
}

function renderStats(s) {
  const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
  $("#stats").innerHTML = `<span><b>${s.episodes}</b> episodes</span><span><b>${s.human_labeled}</b> labeled</span>` +
    `<span>human vs sim <b>${pct(s.human_vs_sim_agreement)}</b> (n=${s.human_vs_sim_n})</span>` +
    `<span><b>${s.auto_labeled ?? 0}</b> auto-labeled · review queue <b>${s.review_queue ?? 0}</b></span>` +
    `<span>Dream-1 recovery <b>${s.recovered ?? 0}/${s.recovery_runs ?? 0}</b> · baselines ${s.baselines ?? 0}</span>` +
    `<span>verifier vs sim <b>${pct(s.verifier_vs_sim_agreement)}</b> (n=${s.verifier_vs_sim_n})</span>`;
}

function renderFilters() {
  $("#filters").innerHTML = FILTERS.map(([k, n]) => `<button data-f="${k}" class="${k === state.filter ? "on" : ""}">${n}</button>`).join("");
  $("#filters").onclick = e => { const f = e.target.dataset.f; if (!f) return; state.filter = f; store.set("filter", f); renderFilters(); renderList(); };
}

function renderList() {
  const items = visible();
  $("#list").innerHTML = items.length ? items.map(e => `
    <div class="item ${e.id === state.sel ? "sel" : ""}" data-id="${e.id}">
      <div class="task">${esc(e.task)}</div>
      <div class="sub">${blind() && !e.human_label ? "" : "sim " + chip(e.sim_label)} you ${chip(e.human_label)}
        <span>${esc((e.source || "").replace("scripted:", "script:").replace("perturb:", "disturb:"))}</span>${e.auto_review && !e.human_label ? `<span class="chip uncertain" title="auto label needs review">review</span>` : ""}${e.perturb_kind ? (e.perturb_policy === "hold" ? `<span class="chip" title="disturbance with no recovery attempt">baseline</span>` : `<span class="chip ${e.recovered ? "success" : "failure"}">${e.recovered ? "recovered" : "not recovered"}</span>`) : ""}${e.pca_state === "ready" ? `<span title="feature PCA ready">· PCA</span>` : ""}</div>
    </div>`).join("") : `<div class="empty">Nothing here.</div>`;
  $("#list").onclick = e => { const it = e.target.closest(".item"); if (it) select(it.dataset.id); };
}

async function select(id) {
  state.sel = id; look = 0;
  renderList();
  const ep = await fetch("/api/episodes/" + id).then(r => r.json());
  state.ep = ep;
  state.draft = ep.label ? { ...ep.label } : { label: null, reason: null, failure_time_s: null, notes: "" };
  renderMain(); renderRight();
}

// --- video -------------------------------------------------------------------------------------------------
let speed = Number(store.get("speed", "2"));
function vids() { return [...document.querySelectorAll("main video")]; }
function primary() { return $("#v-top") || $("#p-top") || vids()[0]; }
let view = store.get("view", "both");  // camera | pca | both
let look = 0;  // 0: the recorded cameras; k: rerender.py appearance variant k (same motion and label)
function pcaState(pca) {
  const s = pca && pca.status;
  if (!s) return "PCA not made yet (python pca.py --all)";
  if (s.state === "ready") return "";
  if (s.state === "running") return `PCA: ${s.done}/${s.total} frames…`;
  if (s.state === "paused") return `PCA paused: ${s.reason || "an episode is being recorded"}`;
  if (s.state === "error") return "PCA failed: " + (s.error || "");
  return "PCA: " + s.state + "…";
}
function methodPanel(pca) {
  const i = pca && pca.info;
  const facts = i ? `${i.method === "naf" ? "NAF" : "bilinear"} · ${i.frames} frames · ${i.ms_per_frame} ms/frame on ${i.device} · ${i.seconds} s in all · ${i.reused_views} unchanged views reused` : "";
  return `<details class="method"><summary>How the feature PCA maps are made</summary><ol>
    <li><b>Features</b>: each camera frame is resized to 224×224 and passed through DINOv2 ViT-S/14, a self-supervised vision model: a 16×16 grid of 384-dimensional patch features. (Dream-1's own features are not available through its API.)</li>
    <li><b>PCA</b>: one basis per episode, fitted on frames spread over the whole episode and all three cameras, so a colour means the same thing at every moment and in every view. The first three components are shown as red, green and blue: patches that look alike to the model get alike colours.</li>
    <li><b>NAF upsampling</b>: NAF (<i>Zero-Shot Feature Upsampling via Neighborhood Attention Filtering</i>, Chambon et al., valeo.ai, CVPR 2026) lifts the 16×16 map to 224×224 without training for this model: each pixel attends to the 9×9 patches around it, with weights from the image's content and position, so feature edges follow the edges in the picture. PCA is linear and NAF averages each attention head's values, so the 3 projected values per head are upsampled instead of 384 features: the same result for far less work.</li>
    <li><b>Here</b>: made after the episode by <code>pca.py</code>, paused while an episode is recording; each map is averaged with its neighbours in time, and a camera whose image did not change keeps its previous map. NAF normally needs NATTEN (CUDA); a plain PyTorch neighbourhood attention runs it on any GPU or CPU, and cached RoPE tables, split padding, float16 and <code>torch.compile</code> make it about 1.9× faster than released. The map is stretched back to 16:9 so it lines up with the camera.</li>
  </ol>${facts ? `<div class="facts">This episode: ${esc(facts)}</div>` : ""}</details>`;
}
function simTime(v) { return state.ep.frame_t0 + v; }
function videoTime(t) { return Math.max(0, t - state.ep.frame_t0); }
function duration() { const p = primary(); return p && isFinite(p.duration) ? p.duration : state.ep.frame_count / state.ep.fps; }

function renderMain() {
  const ep = state.ep, cams = ["top", "left", "right"].filter(c => ep.videos.includes(c + ".mp4"));
  const hasPca = cams.length > 0 && cams.every(c => (ep.pca?.videos || []).includes(c + ".mp4"));
  const mode = hasPca ? view : "camera";
  const variants = (ep.aug && ep.aug.variants) || [];
  if (look && !variants.some(x => x.variant === look)) look = 0;
  const camSrc = c => look ? `/media/${ep.id}/aug/${look}/${c}.mp4` : `/media/${ep.id}/${c}.mp4`;
  const v = c => `<div class="cam"><video id="v-${c}" src="${camSrc(c)}" preload="auto" muted playsinline></video><span>${c}${look ? " · look " + look : ""}</span></div>`;
  const pv = c => `<div class="cam"><video id="p-${c}" class="pca" src="/media/${ep.id}/pca/${c}.mp4" preload="auto" muted playsinline></video><span>${c} · PCA</span></div>`;
  const layout = items => `<div class="videos">${items[0]}<div class="side">${items.slice(1).join("")}</div></div>`;
  const videos = !cams.length ? `<div class="empty">No video for this episode.</div>`
    : mode === "both" ? `<div class="videos both">${cams.map(v).join("")}${cams.map(pv).join("")}</div>`
    : layout(cams.map(mode === "pca" ? pv : v));
  $("#main").innerHTML = `
    <div class="title"><h2>${esc(ep.task)}</h2>
      <span class="meta">${esc(ep.id)} · ${esc(ep.source)}${ep.seed != null ? " · seed " + ep.seed : ""} · ${ep.sim_s ?? "?"} s sim</span></div>
    ${videos}
    <div class="controls">
      <button id="play">Play</button><button id="back">−1 frame</button><button id="fwd">+1 frame</button>
      <select id="speed">${[0.5, 1, 2, 4].map(s => `<option value="${s}" ${s === speed ? "selected" : ""}>${s}× sim speed</option>`).join("")}</select>
      <span class="time" id="time"></span>
      <select id="view" title="Camera, feature PCA, or both">${[["camera", "Camera"], ["pca", "Feature PCA"], ["both", "Camera + PCA"]].map(([k, n]) => `<option value="${k}" ${k === mode ? "selected" : ""} ${k !== "camera" && !hasPca ? "disabled" : ""}>${n}</option>`).join("")}</select>
      ${variants.length ? `<select id="look" title="Appearance variants re-rendered from the same motion (rerender.py)"><option value="0">Recorded look</option>${variants.map(x => `<option value="${x.variant}" ${x.variant === look ? "selected" : ""}>Look ${x.variant} (re-rendered)</option>`).join("")}</select>` : ""}
      <span class="pca-state">${esc(pcaState(ep.pca))}</span>
    </div>
    <div class="timeline" id="tl"><div class="track"></div><div class="fill" id="fill"></div><div class="head" id="head"></div><div id="pins"></div></div>
    <div class="legend"><span><i style="background:var(--bad)"></i>sim failure time</span><span><i style="background:var(--ok)"></i>sim success time</span><span><i style="background:var(--mark)"></i>your failure mark</span></div>
    ${methodPanel(ep.pca)}`;
  const p = primary(); if (!p) return;
  vids().forEach(x => x.playbackRate = speed);
  p.addEventListener("timeupdate", tick); p.addEventListener("seeked", tick); p.addEventListener("loadedmetadata", () => { tick(); renderPins(); });
  p.addEventListener("play", () => { vids().forEach(x => x !== p && x.play().catch(() => {})); $("#play").textContent = "Pause"; });
  p.addEventListener("pause", () => { vids().forEach(x => x !== p && x.pause()); $("#play").textContent = "Play"; sync(); });
  p.addEventListener("ended", () => { $("#play").textContent = "Play"; });
  $("#play").onclick = togglePlay; $("#back").onclick = () => stepFrame(-1); $("#fwd").onclick = () => stepFrame(1);
  $("#speed").onchange = e => { speed = Number(e.target.value); store.set("speed", speed); vids().forEach(x => x.playbackRate = speed); };
  const lk = $("#look");
  if (lk) lk.onchange = e => { const t = primary().currentTime; look = Number(e.target.value); renderMain(); const q = primary(); if (q) q.addEventListener("loadedmetadata", () => seek(t), { once: true }); };
  $("#view").onchange = e => { const t = primary().currentTime; view = e.target.value; store.set("view", view); renderMain(); const q = primary(); if (q) q.addEventListener("loadedmetadata", () => seek(t), { once: true }); };
  const tl = $("#tl"); let drag = false;
  const seekTo = ev => { const r = tl.getBoundingClientRect(); seek(Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) * duration()); };
  tl.onpointerdown = ev => { drag = true; tl.setPointerCapture(ev.pointerId); seekTo(ev); };
  tl.onpointermove = ev => drag && seekTo(ev); tl.onpointerup = () => drag = false;
  renderPins();
}
function sync() { const p = primary(); vids().forEach(x => { if (x !== p && Math.abs(x.currentTime - p.currentTime) > 0.15) x.currentTime = p.currentTime; }); }
function seek(v) { vids().forEach(x => x.currentTime = v); tick(); }
function stepFrame(n) { const p = primary(); p.pause(); seek(Math.min(duration(), Math.max(0, p.currentTime + n / state.ep.fps))); }
function togglePlay() { const p = primary(); if (!p) return; p.paused ? (p.ended && seek(0), p.play()) : p.pause(); }
function tick() {
  const p = primary(); if (!p) return; const d = duration() || 1, f = p.currentTime / d * 100;
  $("#fill").style.width = f + "%"; $("#head").style.left = `calc(${f}% - 1px)`;
  $("#time").textContent = `t = ${simTime(p.currentTime).toFixed(2)} s (sim)`;
  if (!p.paused) sync();
}
function renderPins() {
  const ep = state.ep, d = duration() || 1, pins = [];
  const at = (t, cls, text) => { const x = videoTime(t) / d * 100; if (x >= 0 && x <= 100) pins.push(`<div class="pin ${cls}" style="left:${x}%">${text}</div>`); };
  if (!blind() || ep.label) {
    if (ep.outcome.failure_time_s != null) at(ep.outcome.failure_time_s, "sim-fail", "sim ✕");
    if (ep.outcome.success_time_s != null) at(ep.outcome.success_time_s, "sim-ok", "sim ✓");
  }
  if (state.draft.label === "failure" && state.draft.failure_time_s != null) at(state.draft.failure_time_s, "human", "you");
  if (ep.perturbation) at(ep.perturbation.applied_at_s, "disturb", "⚡ " + ep.perturbation.kind);
  const el = $("#pins"); if (el) el.innerHTML = pins.join("");
}

// --- right panel -------------------------------------------------------------------------------------------
function judgementCard(title, o, extra = "") {
  if (!o) return `<div class="card"><h3>${title}</h3><div class="hidden-note">Not run yet.</div></div>`;
  const m = o.metrics || {};
  return `<div class="card"><h3>${title}</h3>
    <div class="verdict">${chip(o.label)} ${esc(pretty(o.reason))}</div>
    <div class="kv">
      ${o.success_time_s != null ? `<span>placed at</span><b>${o.success_time_s} s</b>` : ""}
      ${o.failure_time_s != null ? `<span>failure at</span><b>${o.failure_time_s} s</b>` : ""}
      ${o.confidence != null ? `<span>confidence</span><b>${Math.round(o.confidence * 100)}%</b>` : ""}
      ${m.object ? `<span>object moved</span><b>${(m.object_moved_m * 100).toFixed(1)} cm</b><span>to ${esc(m.target)}</span><b>${(m.final_distance_to_target_m * 100).toFixed(1)} cm</b><span>touched</span><b>${m.ever_touched ? "yes" : "no"}</b>` : ""}
      ${o.evidence ? `<span>evidence</span><b>${esc(o.evidence)}</b>` : ""}
    </div>
    ${(o.warnings || []).map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}${extra}</div>`;
}

function autoCard(a) {
  if (!a) return `<div class="card"><h3>Auto label</h3><div class="hidden-note">Not run yet (python autolabel.py).</div></div>`;
  return `<div class="card"><h3>Auto label</h3>
    <div class="verdict">${chip(a.label)} ${esc(pretty(a.reason))}</div>
    <div class="kv"><span>confidence</span><b>${esc(a.confidence)}</b>
      ${a.review ? `<span>review</span><b>${esc(a.review_reasons.map(pretty).join(", "))}</b>` : ""}
      <span>tags</span><b>${esc((a.tags || []).join(" · "))}</b>
      ${a.variants && a.variants.looks ? `<span>looks</span><b>${a.variants.looks} re-rendered variants, same label</b>` : ""}</div></div>`;
}
function disturbCard(p) {
  if (!p) return "";
  const app = Object.entries(p.applied || {}).map(([k, v]) => `${k} ${Array.isArray(v) ? v.join(", ") : v}`).join(" · ");
  return `<div class="card"><h3>Disturbance</h3>
    <div class="verdict">${p.policy === "dream-1" ? `${chip(p.recovered ? "success" : "failure")} ${p.recovered ? "recovered" : "not recovered"}` : `${chip("")} baseline: no recovery attempted`}</div>
    <div class="kv"><span>disturbance</span><b>${esc(p.spec)}</b><span>applied at</span><b>${p.applied_at_s} s</b>
      ${p.window_s ? `<span>lasting</span><b>${p.window_s} s</b>` : ""}${app ? `<span>applied</span><b>${esc(app)}</b>` : ""}
      ${p.recovery_time_s != null ? `<span>recovered in</span><b>${p.recovery_time_s} s</b>` : ""}
      <span>after</span><b>${esc(p.policy)}</b><span>clean run</span><b>${esc(p.clean_episode)}</b>
      ${p.variation ? `<span>variation</span><b>+${p.variation.extra_delay_s} s, ${esc(JSON.stringify(p.variation.scaled))}</b>` : ""}
      <span>replay drift</span><b>${(p.replay_drift_m * 1000).toFixed(3)} mm</b></div></div>`;
}

function renderRight() {
  const ep = state.ep, d = state.draft, hide = blind() && !ep.label;
  const reasons = state.reasons.map(r => `<option value="${r}" ${d.reason === r ? "selected" : ""}>${pretty(r)}</option>`).join("");
  $("#right").innerHTML = `
    <div class="card"><h3>Your label</h3>
      <div class="choices">
        <button class="success ${d.label === "success" ? "on" : ""}" data-l="success">Success<small>1</small></button>
        <button class="failure ${d.label === "failure" ? "on" : ""}" data-l="failure">Failure<small>2</small></button>
        <button class="uncertain ${d.label === "uncertain" ? "on" : ""}" data-l="uncertain">Uncertain<small>3</small></button>
      </div>
      <div id="failfields" style="display:${d.label === "failure" ? "block" : "none"}">
        <div class="field">Failure reason<select id="reason"><option value="">choose…</option>${reasons}</select></div>
        <div class="field">Failure time (sim s)<div class="row"><input id="ftime" type="number" step="0.05" value="${d.failure_time_s ?? ""}" placeholder="not set"><button id="mark">Mark now (M)</button></div></div>
      </div>
      <div class="field">Notes<textarea id="notes" rows="2" placeholder="optional">${esc(d.notes)}</textarea></div>
      <button class="save" id="save" ${d.label ? "" : "disabled"}>Save &amp; next (Enter)</button>
      <div class="status" id="status">${ep.label ? `Saved by ${esc(ep.label.labeler)} at ${esc(ep.label.labeled_at)}` : "Not labeled yet."}</div>
    </div>
    ${hide ? `<div class="card"><h3>Simulator judgement</h3><div class="hidden-note">Hidden in blind mode until you save your label.</div></div>` : judgementCard("Simulator judgement (ground truth)", ep.outcome)}
    ${hide ? "" : autoCard(ep.auto)}
    ${disturbCard(ep.perturbation)}
    ${hide ? "" : judgementCard("VLM verifier", ep.verifier)}
    <div class="card keys"><h3>Keys</h3><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> frame · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> label · <kbd>M</kbd> mark failure time · <kbd>Enter</kbd> save &amp; next · <kbd>J</kbd><kbd>K</kbd> next / previous</div>`;
  $(".choices").onclick = e => { const b = e.target.closest("button"); if (b) setLabel(b.dataset.l); };
  const reason = $("#reason"); if (reason) reason.onchange = e => state.draft.reason = e.target.value || null;
  const ftime = $("#ftime"); if (ftime) ftime.oninput = e => { state.draft.failure_time_s = e.target.value === "" ? null : Number(e.target.value); renderPins(); };
  const mark = $("#mark"); if (mark) mark.onclick = markNow;
  $("#notes").oninput = e => state.draft.notes = e.target.value;
  $("#save").onclick = save;
}

function setLabel(l) {
  state.draft.label = l;
  if (l === "failure" && state.draft.failure_time_s == null && primary()) state.draft.failure_time_s = Number(simTime(primary().currentTime).toFixed(2));
  renderRight(); renderPins();
}
function markNow() { if (!primary()) return; state.draft.failure_time_s = Number(simTime(primary().currentTime).toFixed(2)); if (state.draft.label !== "failure") state.draft.label = "failure"; renderRight(); renderPins(); }

async function save() {
  const d = state.draft; if (!d.label) return;
  const labeler = $("#labeler").value.trim(); store.set("labeler", labeler);
  const r = await fetch(`/api/episodes/${state.sel}/label`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...d, labeler: labeler || undefined }) }).then(r => r.json());
  if (!r.ok) { $("#status").textContent = "Not saved: " + r.error; return; }
  const was = state.sel, order = visible().map(e => e.id), i = order.indexOf(was);
  await load(true);
  const next = visible().find(e => e.id !== was && (state.filter === "unlabeled" || order.indexOf(e.id) > i)) || visible()[0];
  if (next && next.id !== was) select(next.id); else select(was);
}

function move(n) { const order = visible().map(e => e.id), i = order.indexOf(state.sel); const id = order[i + n]; if (id) select(id); }

document.addEventListener("keydown", e => {
  if (e.target.matches("input[type=text], input[type=number], textarea, select")) { if (e.key === "Enter" && !e.target.matches("textarea")) { e.preventDefault(); save(); } return; }
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "arrowleft") stepFrame(-1); else if (k === "arrowright") stepFrame(1);
  else if (k === "1") setLabel("success"); else if (k === "2") setLabel("failure"); else if (k === "3") setLabel("uncertain");
  else if (k === "m") markNow(); else if (k === "enter") { e.preventDefault(); save(); }
  else if (k === "j") move(1); else if (k === "k") move(-1);
});
$("#blind").checked = store.get("blind", "0") === "1";
$("#blind").onchange = e => { store.set("blind", e.target.checked ? "1" : "0"); renderList(); if (state.ep) { renderRight(); renderPins(); } };
$("#labeler").onchange = e => store.set("labeler", e.target.value.trim());
load(false);
</script>
</body>
</html>
