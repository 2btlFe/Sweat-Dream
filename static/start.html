<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweet Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>
  const selectedTheme = new URLSearchParams(location.search).get("theme");
  if (selectedTheme === "soft" || selectedTheme === "bauhaus") {
    sessionStorage.setItem("sweetDreamTheme", selectedTheme);
  }
  if (sessionStorage.getItem("sweetDreamTheme") !== "bauhaus") {
    document.documentElement.dataset.theme = "soft";
  }
</script>
<link rel="stylesheet" href="/theme.css">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  main { min-height: 100svh; display: grid; place-items: center; padding: 24px; }
  .start { display: grid; grid-template-columns: 1fr 1fr; width: min(100%, 920px); border: 1px solid var(--rule); }
  .intro { display: grid; align-content: space-between; gap: clamp(42px, 8vw, 90px);
           padding: clamp(22px, 5vw, 48px); background: var(--ink); color: var(--paper); }
  .geometry { position: relative; width: 96px; aspect-ratio: 2; }
  .geometry::before, .geometry::after { position: absolute; content: ""; width: 50%; height: 100%; }
  .geometry::before { border-radius: 50%; background: var(--sun); }
  .geometry::after { right: 0; border: 1px solid var(--sun); border-radius: 0 50% 50% 0; }
  .brand { font-size: clamp(40px, 7vw, 78px); }
  .brand span { display: block; }
  .intro .tagline { color: #e4ded0; margin: 14px 0 0; }
  .site .login { align-content: center; border: 0; padding: clamp(22px, 5vw, 48px); }
  .login h2 { font-size: 25px; margin: 0 0 6px; letter-spacing: -.035em; }
  .lead { margin: 0 0 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .row button { flex: 1 1 120px; }
  .signed { display: flex; align-items: center; gap: 8px; padding: 11px; border: 1px solid var(--rule); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #237950; flex: none; }
  .help { margin: 16px 0 0; }
  @media (max-width: 640px) {
    main { padding: 16px; }
    .start { grid-template-columns: 1fr; }
    .intro { gap: 24px; }
    .geometry { width: 56px; }
    .brand span { display: inline; }
  }
</style>
</head>
<body class="site">
<main>
  <div class="start">
    <header class="intro">
      <div class="geometry" aria-hidden="true"></div>
      <div>
        <h1 class="brand">Sweet <span>Dream</span></h1>
        <p class="tagline">Dream Labs</p>
      </div>
    </header>

    <section class="panel login" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Sign in</h2>
      <p class="lead muted small">Enter your Dream API key. It stays in this computer's memory while the server runs; it is not saved to disk.</p>

      <div id="signedIn" hidden>
        <div class="signed"><span class="dot" aria-hidden="true"></span><span>Signed in with the key ending <b id="keyHint"></b></span></div>
        <div class="row">
          <button type="button" id="continue">Continue</button>
          <button type="button" class="outline" id="other">Use another key</button>
        </div>
      </div>

      <form id="loginForm" autocomplete="off" hidden>
        <label for="apiKey">Dream API key</label>
        <input id="apiKey" type="password" placeholder="dl_live_…" spellcheck="false" autocomplete="off" required>
        <div class="error" id="loginError" role="alert" hidden></div>
        <div class="row">
          <button type="submit" id="signIn">Sign in</button>
        </div>
        <p class="help muted small">No key yet? Create one at <a href="https://platform.dreamlabs.ai/api-keys" target="_blank" rel="noopener">platform.dreamlabs.ai/api-keys</a>.</p>
      </form>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);

async function api(path, body) {
  const options = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function show(key) {
  const signed = !!key?.source;
  $("signedIn").hidden = !signed;
  $("loginForm").hidden = signed;
  if (signed) $("keyHint").textContent = "…" + key.hint;
  else $("apiKey").focus();
}

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  $("loginError").hidden = true;
  $("signIn").disabled = true;
  $("signIn").textContent = "Checking the key…";
  try {
    await api("/api/key", { key: $("apiKey").value.trim(), verify: true });
    location.href = "/sections";
  } catch (err) {
    $("loginError").textContent = err.message;
    $("loginError").hidden = false;
  }
  $("signIn").disabled = false;
  $("signIn").textContent = "Sign in";
};
$("continue").onclick = () => { location.href = "/sections"; };
$("other").onclick = () => { $("apiKey").value = ""; show(null); };

api("/api/status").then(s => show(s.key)).catch(() => show(null));
</script>
</body>
</html>
