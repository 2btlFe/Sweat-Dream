<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Sweet Dream: a sleepy cloud eating honey</title>
  <!-- the cloud -->
  <g fill="#1c1c1c">
    <circle cx="19" cy="30" r="11"/>
    <circle cx="32" cy="22" r="14"/>
    <circle cx="45" cy="30" r="11"/>
    <rect x="8" y="28" width="48" height="18" rx="9"/>
  </g>
  <!-- sleepy, happy eyes and blush -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <path d="M22 31q3 3 6 0"/>
    <path d="M36 31q3 3 6 0"/>
  </g>
  <ellipse cx="20" cy="37" rx="3" ry="1.8" fill="#ffb06c"/>
  <ellipse cx="44" cy="37" rx="3" ry="1.8" fill="#ffb06c"/>
  <!-- mouth with honey on it -->
  <path d="M29 37.5q3 3.2 6 0" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M33.6 39.3q.9 2.6 0 4.4q-1.4-1.1-.9-3.3z" fill="#ffc94a"/>
  <!-- honey dipper going into the mouth -->
  <path d="M35 40l13 10" stroke="#9c4f24" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#ffc94a" stroke="#9c4f24" stroke-width="1">
    <rect x="31.4" y="36.6" width="6.4" height="5.6" rx="2.2" transform="rotate(37 34.6 39.4)"/>
  </g>
  <!-- a honey drop falling from the dipper -->
  <path d="M33 43.6q1.8 2.6 1.8 3.8a1.8 1.8 0 0 1-3.6 0q0-1.2 1.8-3.8z" fill="#ffc94a" stroke="#9c4f24" stroke-width=".8"/>
  <!-- honey pot -->
  <path d="M42 48h16l-1.6 9.6a3.4 3.4 0 0 1-3.4 2.9h-6a3.4 3.4 0 0 1-3.4-2.9z" fill="#ffe885" stroke="#1c1c1c" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="40.6" y="45.6" width="18.8" height="4" rx="2" fill="#ffc94a" stroke="#1c1c1c" stroke-width="1.6"/>
  <path d="M44.6 49.6v4a1.6 1.6 0 0 0 3.2 0v-4z" fill="#ffc94a"/>
  <path d="M52 49.6v2.2a1.2 1.2 0 0 0 2.4 0v-2.2z" fill="#ffc94a"/>
  <path d="M44.4 54.4h11" stroke="#9c4f24" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
</svg>
